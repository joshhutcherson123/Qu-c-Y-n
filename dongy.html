<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng ý</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css folder/shared.css">
    <style>
        .title{
            font-family: var(--font-script);
            color: var(--rose);
            font-size: clamp(46px, 10vw, 88px);
            margin: 0;
            text-shadow: 0 4px 18px rgba(214, 41, 62, 0.25);
        }
        .click{
            font-weight: 500;
            font-size: clamp(16px, 3vw, 22px);
            margin: 8px 0 0;
        }

        .stage{ position: relative; margin-top: 24px; }

        /* Bình hoa mọc lên rồi đung đưa nhẹ */
        .flower{
            display: block;
            width: auto;
            height: min(58vh, 520px);
            transform-origin: bottom center;
            filter: drop-shadow(0 18px 18px rgba(155, 28, 49, 0.28));
            animation: grow 1.3s cubic-bezier(.2,1.3,.4,1) 0.5s both,
                       sway 4.5s ease-in-out 1.8s infinite;
        }
        @keyframes grow{
            from{ opacity: 0; transform: scale(0.2) translateY(60px); }
            to{ opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes sway{
            0%,100%{ transform: rotate(-1.8deg); }
            50%{ transform: rotate(1.8deg); }
        }

        /* Lá thư nảy lên đập đập, hover thì bay lên */
        .envelop{
            position: absolute;
            bottom: -10px;
            right: -50px;
            width: 110px;
            cursor: pointer;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.25));
            animation: pop 0.8s cubic-bezier(.2,1.6,.4,1) 1.6s both,
                       beat 1.1s ease-in-out 2.4s infinite;
            transition: transform 0.3s;
        }
        .envelop:hover{ animation-play-state: paused; transform: translateY(-10px) rotate(-8deg) scale(1.15); }
        @keyframes pop{
            from{ opacity: 0; transform: scale(0) rotate(-40deg); }
            to{ opacity: 1; transform: scale(1) rotate(0); }
        }
        @keyframes beat{
            0%,100%{ transform: scale(1); }
            50%{ transform: scale(1.12); }
        }
        @media (max-width: 520px){ .envelop{ right: -20px; width: 90px; } }
    </style>
</head>
<body>
    <h1 class="title reveal" style="--i:0">Hoa cho người đẹp</h1>
    <h2 class="click reveal" style="--i:1">Bấm vô thư là thấy quà ròi! 💌</h2>
    <div class="stage">
        <img class="flower" src="img/hoa-hong-800x1280.png" alt="Bình hoa hồng">
        <a href="thu.html">
            <img class="envelop" src="img/la-thu-182x147.png" alt="Lá thư">
        </a>
    </div>
    <script src="js/shared.js"></script>
</body>
</html>
