<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Từ chối</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css folder/shared.css">
    <style>
        .loichao{
            font-family: var(--font-script);
            color: var(--rose);
            font-size: clamp(52px, 11vw, 100px);
            margin: 0;
            animation: shake 0.7s 0.8s both;
        }
        .dudo{
            font-weight: 500;
            font-size: clamp(18px, 3.4vw, 26px);
            margin: 14px 0 0;
        }
        @keyframes shake{
            0%,100%{ transform: translateX(0); }
            20%{ transform: translateX(-12px) rotate(-2deg); }
            40%{ transform: translateX(10px) rotate(2deg); }
            60%{ transform: translateX(-8px); }
            80%{ transform: translateX(6px); }
        }
        .sticker{
            width: min(220px, 55vw);
            height: auto;
            margin-top: 16px;
            filter: drop-shadow(0 8px 10px rgba(155, 28, 49, 0.25));
            animation: stickerPop 0.7s cubic-bezier(.2,1.6,.4,1) 1s both;
        }
        @keyframes stickerPop{
            from{ opacity: 0; transform: scale(0) rotate(-20deg); }
            to{ opacity: 1; transform: scale(1) rotate(0); }
        }
        #khongnhan{ position: relative; transition: transform 0.25s cubic-bezier(.3,1.6,.5,1); }
    </style>
</head>
<body>
    <h1 class="loichao reveal" style="--i:0">Ơ kìa :&lt;&lt;</h1>
    <h2 class="dudo reveal" style="--i:2">Không nhận là tồi lắm á 😞</h2>
    <img class="sticker" src="img/Sad Hamster Sticker.gif" alt="Sticker" onerror="this.style.display='none'">
    <div class="btn-row reveal" style="--i:4">
        <a href="index.html"><button class="btn">Thôi cũng được</button></a>
        <button class="btn ghost" id="khongnhan">Nhất quyết không!!</button>
    </div>
    <script src="js/shared.js"></script>
    <script>
        // Nút "Nhất quyết không" cứ bị chạm vào là né sang chỗ khác :D
        var nut = document.getElementById('khongnhan');
        var lanNe = 0;
        var cau = ['Nhất quyết không!!', 'Ơ né nè 😝', 'Đừng bấm mà', 'Hông bấm được đâu', 'Thôi nhận đi cô ơi 🥺'];
        function ne(e){
            e.preventDefault();
            lanNe++;
            var maxX = window.innerWidth / 2 - 130, maxY = window.innerHeight / 3;
            var x = (Math.random() * 2 - 1) * maxX;
            var y = (Math.random() * 2 - 1) * maxY;
            nut.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + (Math.random()*20-10) + 'deg)';
            nut.textContent = cau[Math.min(lanNe, cau.length - 1)];
        }
        nut.addEventListener('mouseenter', ne);
        nut.addEventListener('touchstart', ne, {passive: false});
        nut.addEventListener('click', ne);
    </script>
</body>
</html>
